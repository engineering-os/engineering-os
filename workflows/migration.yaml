name: migration
description: Database or API migration workflow with rollback planning
stages:
  - id: analyze
    description: Analyze current state and migration scope
    dependsOn: []
    approval: required
    output: analysis.md

  - id: plan
    description: Create step-by-step migration plan with ordering
    dependsOn: [analyze]
    approval: required
    output: migration-plan.md

  - id: rollback
    description: Design rollback strategy for each migration step
    dependsOn: [plan]
    approval: required
    output: rollback-plan.md

  - id: migrate
    description: Execute migration steps
    dependsOn: [rollback]
    approval: none
    output: migration-log.md

  - id: verify
    description: Verify data integrity and service health post-migration
    dependsOn: [migrate]
    approval: none
    output: verification-report.md

  - id: review
    description: Final review and sign-off
    dependsOn: [verify]
    approval: required
    output: review.md
